# Vendor defaults, one section per provider (the section name is the
# value PROVIDER is set to).
#
#   base_url     API root, without a trailing slash
#   model        default model id; leave empty to force an explicit choice
#   api_key_env  environment variables holding the key, comma-separated,
#                checked in order
#
# Required environment variables (there are no defaults; the server warns
# at startup and /convert returns 503 until they are set):
#   export PROVIDER=anthropic             # or: gemini
#   export ANTHROPIC_API_KEY=sk-ant-...   # the key named by api_key_env
#   export NOTEBOOK_OUTPUT_DIR=~/Downloads  # the variable named by
#                                           # [app] output_dir
# API keys are never stored in this file.
#
# To change any of these without editing this file, point
# PAPER_TO_NOTEBOOK_CONFIG at your own .ini file: its values override the
# ones here, key by key. Environment variables (PROVIDER_MODEL,
# PROVIDER_BASE_URL) and keyword overrides passed to get_provider() still
# take precedence over both.

[anthropic]
base_url = https://api.anthropic.com/v1
model = claude-opus-5-5
api_key_env = ANTHROPIC_API_KEY
# Tuning (override with PROVIDER_EFFORT, PROVIDER_SPEED, PROVIDER_MAX_TOKENS):
#   effort      low | medium | high | xhigh | max. Higher effort thinks
#               longer: slower, and thinking uses more of max_tokens.
#   speed       standard | fast. Fast mode writes up to ~2.5x faster at
#               twice the per-token price; falls back to standard if busy.
#   max_tokens  output budget shared by thinking and the notebook (max 128000).
effort = medium
speed = fast
max_tokens = 128000

[gemini]
base_url = https://generativelanguage.googleapis.com/v1beta
model = gemini-3.8-flash
api_key_env = GEMINI_API_KEY

# Application settings.
#
#   output_dir   environment variable holding the folder where every
#                generated notebook is also saved (required), e.g.
#                  export NOTEBOOK_OUTPUT_DIR=~/Downloads
#                Relative paths are resolved from the project root;
#                ~ and $VARIABLES in the value are expanded.
[app]
output_dir = NOTEBOOK_OUTPUT_DIR
