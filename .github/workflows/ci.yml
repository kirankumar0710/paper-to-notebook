# CI/CD Pipeline — Traditional Software Development
# This is the pipeline we'll discuss in the lecture:
# "This YAML file took 2 hours to get right."

name: CI

on:
  push:
    branches: [dev-ver-5.0]
  pull_request:
    branches: [dev-ver-5.0]

# Actions are pinned to full commit SHAs (version in the comment): a tag
# can be moved to other code by the action's owner, a SHA cannot. To
# update, look up the new release's commit, e.g.
#   git ls-remote https://github.com/actions/checkout 'refs/tags/v4^{}' refs/tags/v4

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      # Same checks as running ./check.sh locally: ruff lint, ruff
      # format, pip-audit dependency vulnerabilities, pytest + coverage.
      - name: Run all checks
        run: ./check.sh

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
