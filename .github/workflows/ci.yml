# CI/CD Pipeline — Traditional Software Development
# This is the pipeline we'll discuss in the lecture:
# "This YAML file took 2 hours to get right."

name: CI

on:
  push:
    branches: [dev-ver-5.0]
  pull_request:
    branches: [dev-ver-5.0]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      # Same checks as running ./check.sh locally: ruff lint, ruff
      # format, pip-audit dependency vulnerabilities, pytest + coverage.
      - name: Run all checks
        run: ./check.sh

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
