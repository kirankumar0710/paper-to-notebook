<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1210" viewBox="0 0 1000 1210" role="img" aria-label="Overview: the browser dashboard sends a PDF or arXiv link to the API routes. For an arXiv link, the arXiv source asks the arXiv MCP server for the paper and downloads the PDF from arxiv.org. The routes run the conversion package, which asks an LLM provider to call the vendor's LLM API. Shared helpers in util read config.toml and write notebooks to the output folder.">
  <title>Paper to Notebook · overview</title>
  <style>
    .bg { fill: #ffffff; }
    .title { font: 600 23px "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1b2230; }
    .zone { fill: #eceff4; stroke: #b9c1ce; stroke-width: 1.2; }
    .zone.ext { fill: none; stroke-dasharray: 6 5; }
    .zlabel { font: 600 16px "IBM Plex Mono", Menlo, Consolas, monospace; letter-spacing: 0.06em; fill: #5c6678; }
    .box { fill: #ffffff; stroke: #b9c1ce; stroke-width: 1.5; }
    .box.acc { stroke: #2456c9; stroke-width: 2; }
    .box.mcp { stroke: #3a9e9a; stroke-width: 2; }
    .h { font: 600 19px "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1b2230; }
    .f { font: 400 16px "IBM Plex Mono", Menlo, Consolas, monospace; fill: #2456c9; }
    .s { font: 400 16px "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #5c6678; }
    .lbl { font: 400 16px "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #5c6678; }
    .lbl.acc { fill: #2456c9; }
    .lbl.mcp { fill: #2b7f7b; }
    .wire { fill: none; stroke: #9aa5b6; stroke-width: 1.8; }
    .wire.acc { stroke: #2456c9; stroke-width: 2.2; }
    .wire.mcp { stroke: #3a9e9a; stroke-width: 2.2; }
    .wire.dash { stroke-dasharray: 6 5; }
    .head { fill: #9aa5b6; }
    .head.acc { fill: #2456c9; }
    .head.mcp { fill: #3a9e9a; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="aacc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head acc" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="amcp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head mcp" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="1210"/>
  <text class="title" x="24" y="42">Paper to Notebook · overview</text>

  <!-- browser -->
  <text class="zlabel" x="50" y="88">BROWSER</text>
  <rect class="box" x="50" y="100" width="360" height="126" rx="10"/>
  <text class="h" x="72" y="134">Dashboard</text>
  <text class="f" x="72" y="160">api/static/</text>
  <text class="s" x="72" y="188">6 panels: config, upload/link,</text>
  <text class="s" x="72" y="210">output, MCP log, metrics, download</text>

  <!-- outside, top: what an arXiv lookup talks to -->
  <rect class="zone ext" x="490" y="74" width="486" height="178" rx="12"/>
  <text class="zlabel" x="506" y="98">OUTSIDE THE APP</text>
  <rect class="box mcp" x="506" y="112" width="220" height="118" rx="10"/>
  <text class="h" x="524" y="142">arXiv MCP server</text>
  <text class="f" x="524" y="166">arxiv-mcp-server</text>
  <text class="s" x="524" y="190">child process, stdio</text>
  <text class="s" x="524" y="212">tool: get_abstract</text>
  <rect class="box" x="746" y="112" width="210" height="118" rx="10"/>
  <text class="h" x="764" y="142">arxiv.org</text>
  <text class="s" x="764" y="168">the paper's PDF,</text>
  <text class="s" x="764" y="190">downloaded by the app</text>

  <!-- server zone -->
  <rect class="zone" x="24" y="290" width="952" height="628" rx="12"/>
  <text class="zlabel" x="370" y="316">FASTAPI SERVER</text>

  <rect class="box" x="50" y="330" width="360" height="126" rx="10"/>
  <text class="h" x="72" y="364">API routes</text>
  <text class="f" x="72" y="390">api/routes/</text>
  <text class="s" x="72" y="418">check input, stream progress,</text>
  <text class="s" x="72" y="440">serve files and MCP events</text>

  <rect class="box" x="50" y="546" width="360" height="126" rx="10"/>
  <text class="h" x="72" y="580">Conversion</text>
  <text class="f" x="72" y="606">notebook_builder/</text>
  <text class="s" x="72" y="634">prompt + schema in,</text>
  <text class="s" x="72" y="656">Colab .ipynb out</text>

  <rect class="box" x="50" y="762" width="360" height="126" rx="10"/>
  <text class="h" x="72" y="796">LLM providers</text>
  <text class="f" x="72" y="822">providers/</text>
  <text class="s" x="72" y="850">Anthropic · Gemini · OpenAI</text>
  <text class="s" x="72" y="872">keys, retries, progress</text>

  <rect class="box mcp" x="530" y="330" width="420" height="126" rx="10"/>
  <text class="h" x="554" y="364">arXiv source</text>
  <text class="f" x="554" y="390">sources/</text>
  <text class="s" x="554" y="418">arXiv link → MCP lookup → PDF;</text>
  <text class="s" x="554" y="440">logs each step for the MCP activity log</text>

  <rect class="box" x="530" y="500" width="420" height="388" rx="10"/>
  <text class="h" x="554" y="540">Shared helpers</text>
  <text class="f" x="554" y="566">util/</text>
  <text class="s" x="554" y="616">config.toml loader</text>
  <text class="s" x="554" y="666">cost estimate</text>
  <text class="s" x="554" y="716">PDF page count</text>
  <text class="s" x="554" y="766">safe file saves (never overwrite)</text>
  <text class="s" x="554" y="816">logging with masked API keys</text>

  <!-- outside, bottom -->
  <rect class="zone ext" x="24" y="978" width="952" height="172" rx="12"/>
  <text class="zlabel" x="430" y="1004">OUTSIDE THE APP</text>

  <rect class="box acc" x="50" y="1018" width="360" height="112" rx="10"/>
  <text class="h" x="72" y="1052">LLM API</text>
  <text class="s" x="72" y="1080">vendor HTTPS API</text>
  <text class="s" x="72" y="1104">the paid step, often minutes</text>

  <rect class="box" x="530" y="1018" width="200" height="112" rx="10"/>
  <text class="h" x="552" y="1052">config.toml</text>
  <text class="s" x="552" y="1080">+ environment</text>
  <text class="s" x="552" y="1104">variables</text>

  <rect class="box" x="750" y="1018" width="200" height="112" rx="10"/>
  <text class="h" x="772" y="1052">Output folder</text>
  <text class="s" x="772" y="1080">~/Downloads</text>
  <text class="s" x="772" y="1104">by default</text>

  <!-- chain: request down on the left, response up on the right -->
  <line class="wire" x1="150" y1="226" x2="150" y2="328" marker-end="url(#a)"/>
  <text class="lbl" x="162" y="272">PDF or arXiv link</text>
  <line class="wire dash" x1="310" y1="330" x2="310" y2="228" marker-end="url(#a)"/>
  <text class="lbl" x="322" y="272">live progress</text>

  <line class="wire" x1="150" y1="456" x2="150" y2="544" marker-end="url(#a)"/>
  <text class="lbl" x="162" y="506">PDF</text>
  <line class="wire dash" x1="310" y1="546" x2="310" y2="458" marker-end="url(#a)"/>
  <text class="lbl" x="322" y="506">notebook</text>

  <line class="wire" x1="150" y1="672" x2="150" y2="760" marker-end="url(#a)"/>
  <text class="lbl" x="162" y="722">prompt + schema</text>
  <line class="wire dash" x1="310" y1="762" x2="310" y2="674" marker-end="url(#a)"/>
  <text class="lbl" x="322" y="722">JSON spec</text>

  <line class="wire acc" x1="150" y1="888" x2="150" y2="1016" marker-end="url(#aacc)"/>
  <text class="lbl acc" x="162" y="954">PDF + prompt</text>
  <line class="wire acc dash" x1="310" y1="1018" x2="310" y2="890" marker-end="url(#aacc)"/>
  <text class="lbl acc" x="322" y="954">JSON reply</text>

  <!-- API routes ↔ arXiv source -->
  <line class="wire mcp" x1="410" y1="374" x2="528" y2="374" marker-end="url(#amcp)"/>
  <text class="lbl mcp" x="469" y="365" text-anchor="middle">arXiv link</text>
  <line class="wire mcp dash" x1="530" y1="420" x2="412" y2="420" marker-end="url(#amcp)"/>
  <text class="lbl mcp" x="469" y="411" text-anchor="middle">PDF</text>

  <!-- arXiv source ↔ MCP server and arxiv.org -->
  <line class="wire mcp" x1="560" y1="330" x2="560" y2="232" marker-end="url(#amcp)"/>
  <text class="lbl mcp" x="570" y="274">get_abstract</text>
  <line class="wire mcp dash" x1="700" y1="230" x2="700" y2="328" marker-end="url(#amcp)"/>
  <text class="lbl mcp" x="710" y="274">title, pdf_url</text>
  <line class="wire mcp" x1="830" y1="330" x2="830" y2="232" marker-end="url(#amcp)"/>
  <text class="lbl mcp" x="840" y="274">GET</text>
  <line class="wire mcp dash" x1="920" y1="230" x2="920" y2="328" marker-end="url(#amcp)"/>
  <text class="lbl mcp" x="930" y="274">PDF</text>

  <!-- uses util -->
  <line class="wire" x1="410" y1="609" x2="528" y2="609" marker-end="url(#a)"/>
  <text class="lbl" x="469" y="600" text-anchor="middle">uses</text>
  <line class="wire" x1="410" y1="825" x2="528" y2="825" marker-end="url(#a)"/>
  <text class="lbl" x="469" y="816" text-anchor="middle">uses</text>

  <!-- util and the outside files -->
  <line class="wire" x1="630" y1="1018" x2="630" y2="890" marker-end="url(#a)"/>
  <text class="lbl" x="642" y="954">settings</text>
  <line class="wire" x1="850" y1="888" x2="850" y2="1016" marker-end="url(#a)"/>
  <text class="lbl" x="862" y="954">.ipynb files</text>

  <!-- legend -->
  <g transform="translate(24, 1186)">
    <line class="wire" x1="0" y1="-5" x2="30" y2="-5"/><text class="s" x="40" y="0">request or call</text>
    <line class="wire dash" x1="176" y1="-5" x2="206" y2="-5"/><text class="s" x="216" y="0">response</text>
    <line class="wire mcp" x1="316" y1="-5" x2="346" y2="-5"/><text class="s" x="356" y="0">arXiv lookup (MCP)</text>
    <line class="wire acc" x1="530" y1="-5" x2="560" y2="-5"/><text class="s" x="570" y="0">the LLM call</text>
  </g>
</svg>
