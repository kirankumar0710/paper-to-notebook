<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="906" viewBox="0 0 1540 906" role="img" aria-label="Subsystems with their inputs and outputs: five dashboard panels each call one FastAPI route; convert.py calls notebook_builder, which calls a provider, which calls the LLM API; each returns its result back along the same path. util reads config.toml and writes notebooks to the output folder.">
  <title>Paper to Notebook · subsystems, inputs and outputs</title>
  <style>
  .bg { fill: #ffffff; }
  .title { font: 600 18px "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1b2230; }
  .zone { fill: #eceff4; stroke: #b9c1ce; stroke-width: 1; }
  .zone.ext { fill: none; stroke-dasharray: 5 4; }
  .box { fill: #ffffff; stroke: #b9c1ce; stroke-width: 1.2; }
  .box.acc { stroke: #2456c9; stroke-width: 1.6; }
  .zlabel { font: 600 11px "IBM Plex Mono", Menlo, Consolas, monospace; letter-spacing: 0.06em; fill: #5c6678; }
  .t { font: 600 12px "IBM Plex Mono", Menlo, Consolas, monospace; fill: #1b2230; }
  .s { font: 400 11px "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #5c6678; }
  .lbl { font: 400 10.5px "IBM Plex Mono", Menlo, Consolas, monospace; fill: #5c6678; }
  .lbl.acc { fill: #2456c9; }
  .io { font: 400 12px "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #5c6678; }
  .io .k { font: 600 11px "IBM Plex Mono", Menlo, Consolas, monospace; fill: #1b2230; }
  .note { font: italic 400 11px "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #5c6678; }
  .wire { fill: none; stroke: #b9c1ce; stroke-width: 1.4; }
  .wire.acc { stroke: #2456c9; stroke-width: 1.8; }
  .wire.dash { stroke-dasharray: 5 4; }
  .life { stroke: #b9c1ce; stroke-width: 1; stroke-dasharray: 3 4; }
  .head { fill: #b9c1ce; }
  .head.acc { fill: #2456c9; }
  .act { fill: #dfe7fb; stroke: #2456c9; stroke-width: 1; }
</style>
  <defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10 z"/></marker><marker id="a1acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head acc" d="M0 0 L10 5 L0 10 z"/></marker></defs>
  <rect class="bg" x="0" y="0" width="1540" height="906"/>
  <text class="title" x="20" y="30">Paper to Notebook · subsystems, inputs and outputs</text>
  <g transform="translate(0, 44)">

<text class="zlabel" x="20" y="18">BROWSER · localhost:8000</text>
<rect class="zone" x="20" y="28" width="270" height="762" rx="10"/>
<text class="zlabel" x="450" y="18">api/ · FastAPI routes</text>
<rect class="zone" x="450" y="28" width="310" height="762" rx="10"/>
<text class="zlabel" x="880" y="18">PYTHON PACKAGES</text>
<rect class="zone" x="880" y="28" width="300" height="762" rx="10"/>
<text class="zlabel" x="1290" y="18">OUTSIDE THE APP</text>
<rect class="zone ext" x="1290" y="28" width="230" height="762" rx="10"/>
<rect class="box" x="36" y="63" width="238" height="74" rx="7"/>
<text class="t" x="50" y="85">1 · Configuration</text>
<text class="io" x="50" y="107"><tspan class="k">in</tspan><tspan x="82">/api/config JSON</tspan></text>
<text class="io" x="50" y="126"><tspan class="k">out</tspan><tspan x="82">settings, key status, folder</tspan></text>
<rect class="box acc" x="36" y="210" width="238" height="74" rx="7"/>
<text class="t" x="50" y="232">2 · Upload paper</text>
<text class="io" x="50" y="254"><tspan class="k">in</tspan><tspan x="82">PDF chosen or dropped</tspan></text>
<text class="io" x="50" y="273"><tspan class="k">out</tspan><tspan x="82">POST /convert/stream</tspan></text>
<rect class="box acc" x="36" y="336" width="238" height="74" rx="7"/>
<text class="t" x="50" y="358">3 · LLM output</text>
<text class="io" x="50" y="380"><tspan class="k">in</tspan><tspan x="82">SSE progress events</tspan></text>
<text class="io" x="50" y="399"><tspan class="k">out</tspan><tspan x="82">stages, log, reasoning</tspan></text>
<rect class="box" x="36" y="460" width="238" height="74" rx="7"/>
<text class="t" x="50" y="482">4 · Metrics</text>
<text class="io" x="50" y="504"><tspan class="k">in</tspan><tspan x="82">result event, session totals</tspan></text>
<text class="io" x="50" y="523"><tspan class="k">out</tspan><tspan x="82">tokens, cost, timing</tspan></text>
<rect class="box" x="36" y="578" width="238" height="74" rx="7"/>
<text class="t" x="50" y="600">5 · Download</text>
<text class="io" x="50" y="622"><tspan class="k">in</tspan><tspan x="82">list of saved notebooks</tspan></text>
<text class="io" x="50" y="641"><tspan class="k">out</tspan><tspan x="82">.ipynb file to the user</tspan></text>
<rect class="box" x="36" y="696" width="238" height="74" rx="7"/>
<text class="t" x="50" y="718">index.html + app.js</text>
<text class="io" x="50" y="740"><tspan class="k">in</tspan><tspan x="82">page from dashboard.py</tspan></text>
<text class="io" x="50" y="759"><tspan class="k">out</tspan><tspan x="82">wires the panels together</tspan></text>
<rect class="box" x="466" y="63" width="278" height="74" rx="7"/>
<text class="t" x="480" y="85">config.py</text>
<text class="io" x="480" y="107"><tspan class="k">in</tspan><tspan x="512">env vars, config.toml</tspan></text>
<text class="io" x="480" y="126"><tspan class="k">out</tspan><tspan x="512">config JSON (never the key)</tspan></text>
<rect class="box acc" x="466" y="210" width="278" height="210" rx="7"/>
<text class="t" x="480" y="232">convert.py</text>
<text class="io" x="480" y="254"><tspan class="k">in</tspan><tspan x="512">PDF upload (≤ 15 MB)</tspan></text>
<text class="io" x="480" y="273"><tspan class="k">out</tspan><tspan x="512">SSE progress, result, error</tspan></text>
<text class="s" x="480" y="296">checks the %PDF- header</text>
<text class="s" x="480" y="315">runs the conversion in a thread</text>
<text class="s" x="480" y="334">streams progress as it arrives</text>
<text class="s" x="480" y="353">saves via download.py</text>
<rect class="box" x="466" y="460" width="134" height="74" rx="7"/>
<text class="t" x="480" y="482">metrics.py</text>
<text class="io" x="480" y="504"><tspan class="k">in</tspan><tspan x="512">usage, cost</tspan></text>
<text class="io" x="480" y="523"><tspan class="k">out</tspan><tspan x="512">totals JSON</tspan></text>
<rect class="box" x="466" y="578" width="278" height="74" rx="7"/>
<text class="t" x="480" y="600">download.py</text>
<text class="io" x="480" y="622"><tspan class="k">in</tspan><tspan x="512">notebook from convert.py</tspan></text>
<text class="io" x="480" y="641"><tspan class="k">out</tspan><tspan x="512">file on disk, download</tspan></text>
<rect class="box" x="466" y="696" width="278" height="74" rx="7"/>
<text class="t" x="480" y="718">dashboard.py</text>
<text class="io" x="480" y="740"><tspan class="k">in</tspan><tspan x="512">index.html + panel files</tspan></text>
<text class="io" x="480" y="759"><tspan class="k">out</tspan><tspan x="512">one HTML page</tspan></text>
<rect class="box acc" x="896" y="50" width="268" height="100" rx="7"/>
<text class="t" x="910" y="72">providers/</text>
<text class="io" x="910" y="94"><tspan class="k">in</tspan><tspan x="942">prompt, schema, PDF bytes</tspan></text>
<text class="io" x="910" y="113"><tspan class="k">out</tspan><tspan x="942">JSON spec + progress</tspan></text>
<text class="s" x="910" y="136">claude · gemini · openai</text>
<rect class="box acc" x="896" y="210" width="268" height="120" rx="7"/>
<text class="t" x="910" y="232">notebook_builder/</text>
<text class="io" x="910" y="254"><tspan class="k">in</tspan><tspan x="942">PDF bytes, provider</tspan></text>
<text class="io" x="910" y="273"><tspan class="k">out</tspan><tspan x="942">ConvertedNotebook</tspan></text>
<text class="s" x="910" y="296">.ipynb + title, packages, GPU</text>
<text class="s" x="910" y="315">prompt.py · converter.py · builder.py</text>
<rect class="box" x="896" y="370" width="268" height="260" rx="7"/>
<text class="t" x="910" y="392">util/</text>
<text class="s" x="910" y="412">each helper: input → output</text>
<text class="io" x="910" y="446"><tspan class="k">config.py</tspan><tspan x="996">TOML → settings</tspan></text>
<text class="io" x="910" y="480"><tspan class="k">pricing.py</tspan><tspan x="996">tokens → USD</tspan></text>
<text class="io" x="910" y="514"><tspan class="k">pdf.py</tspan><tspan x="996">PDF → page count</tspan></text>
<text class="io" x="910" y="548"><tspan class="k">files.py</tspan><tspan x="996">text → new file</tspan></text>
<text class="io" x="910" y="582"><tspan class="k">log.py</tspan><tspan x="996">messages → masked keys</tspan></text>
<rect class="box acc" x="1306" y="50" width="198" height="100" rx="7"/>
<text class="t" x="1320" y="72">LLM API</text>
<text class="io" x="1320" y="94"><tspan class="k">in</tspan><tspan x="1352">PDF, prompt, schema</tspan></text>
<text class="io" x="1320" y="113"><tspan class="k">out</tspan><tspan x="1352">JSON reply</tspan></text>
<text class="s" x="1320" y="136">streamed for Claude only</text>
<rect class="box" x="1306" y="380" width="198" height="60" rx="7"/>
<text class="t" x="1320" y="402">config.toml</text>
<text class="s" x="1320" y="424">+ environment variables</text>
<rect class="box" x="1306" y="560" width="198" height="60" rx="7"/>
<text class="t" x="1320" y="582">Output folder</text>
<text class="s" x="1320" y="604">~/Downloads by default</text>
<line class="wire" x1="274" y1="100" x2="464" y2="100" marker-start="url(#a1)" marker-end="url(#a1)"/>
<text class="lbl" x="369.0" y="93" text-anchor="middle">GET /api/config</text>
<line class="wire acc" x1="274" y1="240" x2="464" y2="240" marker-end="url(#a1acc)"/>
<text class="lbl acc" x="369.0" y="233" text-anchor="middle">POST /convert/stream</text>
<line class="wire acc dash" x1="466" y1="373" x2="276" y2="373" marker-end="url(#a1acc)"/>
<text class="lbl acc" x="371.0" y="366" text-anchor="middle">SSE progress · result</text>
<line class="wire" x1="274" y1="497" x2="464" y2="497" marker-start="url(#a1)" marker-end="url(#a1)"/>
<text class="lbl" x="369.0" y="490" text-anchor="middle">GET /api/metrics/session</text>
<line class="wire" x1="274" y1="615" x2="464" y2="615" marker-start="url(#a1)" marker-end="url(#a1)"/>
<text class="lbl" x="369.0" y="608" text-anchor="middle">GET /api/notebooks/{id}</text>
<line class="wire dash" x1="466" y1="733" x2="276" y2="733" marker-end="url(#a1)"/>
<text class="lbl" x="371.0" y="726" text-anchor="middle">GET / → page</text>
<line class="wire" x1="744" y1="100" x2="894" y2="100" marker-start="url(#a1)" marker-end="url(#a1)"/>
<text class="lbl" x="819.0" y="93" text-anchor="middle">resolve_settings</text>
<line class="wire acc" x1="744" y1="250" x2="894" y2="250" marker-end="url(#a1acc)"/>
<text class="lbl acc" x="819.0" y="243" text-anchor="middle">pdf_to_notebook()</text>
<line class="wire acc dash" x1="896" y1="300" x2="746" y2="300" marker-end="url(#a1acc)"/>
<text class="lbl acc" x="821.0" y="293" text-anchor="middle">ConvertedNotebook</text>
<line class="wire" x1="744" y1="400" x2="894" y2="400" marker-start="url(#a1)" marker-end="url(#a1)"/>
<text class="lbl" x="819.0" y="393" text-anchor="middle">cost, pages</text>
<line class="wire" x1="744" y1="605" x2="894" y2="605" marker-start="url(#a1)" marker-end="url(#a1)"/>
<text class="lbl" x="819.0" y="598" text-anchor="middle">save_unique</text>
<line class="wire" x1="530" y1="420" x2="530" y2="458" marker-end="url(#a1)"/>
<text class="lbl" x="538" y="444" text-anchor="start">usage, cost</text>
<line class="wire" x1="700" y1="420" x2="700" y2="576" marker-end="url(#a1)"/>
<text class="lbl" x="692" y="500" text-anchor="end">saves .ipynb</text>
<line class="wire acc" x1="930" y1="210" x2="930" y2="152" marker-end="url(#a1acc)"/>
<text class="lbl acc" x="938" y="186" text-anchor="start">generate_json()</text>
<line class="wire acc dash" x1="1130" y1="150" x2="1130" y2="208" marker-end="url(#a1acc)"/>
<text class="lbl acc" x="1122" y="186" text-anchor="end">JSON spec</text>
<line class="wire acc" x1="1164" y1="82" x2="1304" y2="82" marker-end="url(#a1acc)"/>
<text class="lbl acc" x="1234.0" y="75" text-anchor="middle">PDF + prompt</text>
<line class="wire acc dash" x1="1306" y1="122" x2="1166" y2="122" marker-end="url(#a1acc)"/>
<text class="lbl acc" x="1236.0" y="115" text-anchor="middle">JSON reply</text>
<line class="wire" x1="1306" y1="410" x2="1166" y2="410" marker-end="url(#a1)"/>
<text class="lbl" x="1236.0" y="403" text-anchor="middle">reads TOML</text>
<line class="wire" x1="1164" y1="590" x2="1304" y2="590" marker-end="url(#a1)"/>
<text class="lbl" x="1234.0" y="583" text-anchor="middle">writes .ipynb</text>
