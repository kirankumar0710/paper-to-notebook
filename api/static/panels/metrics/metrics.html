<!-- 4. Metrics -->
<section class="panel" id="metrics-panel" aria-labelledby="metrics-h">
  <div class="panel-head">
    <h2 id="metrics-h"><span class="num">4</span>Metrics</h2>
  </div>
  <div class="tiles">
    <div class="tile"><div class="k">Input tokens</div>
      <div class="v" id="m-in">—</div><div class="d">paper + prompt</div></div>
    <div class="tile"><div class="k">Output tokens</div>
      <div class="v" id="m-out">—</div>
      <div class="d">thinking + notebook</div></div>

      <div class="v" id="m-total">—</div><div class="d"></div></div>
    <div class="tile"><div class="k">Time</div>
      <div class="v" id="m-time">—</div>
      <div class="d" id="m-time-d"></div></div>
    <div class="tile"><div class="k">Upload size</div>
      <div class="v" id="m-upload">—</div>
      <div class="d" id="m-upload-d"></div></div>
    <div class="tile"><div class="k">Notebook size</div>
      <div class="v" id="m-nb">—</div><div class="d"></div></div>
    <div class="tile"><div class="k">Cells</div>
      <div class="v" id="m-cells">—</div>
      <div class="d" id="m-cells-d"></div></div>
    <div class="tile"><div class="k">Characters written</div>
      <div class="v" id="m-chars">—</div><div class="d"></div></div>
  </div>

</section>
