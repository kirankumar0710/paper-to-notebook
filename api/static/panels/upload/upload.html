<!-- Paper panel, tab "Upload" -->
<div class="tab-panel" id="upload-panel" role="tabpanel"
  aria-labelledby="tab-upload">
  <form id="form">
    <label class="drop" id="drop" for="file">
      <strong>Choose a PDF</strong> or drag it here
      <span id="file-name">No file chosen (max 15 MB)</span>
    </label>
    <input id="file" name="file" type="file" accept=".pdf,application/pdf">

    <p class="or"><span>or</span></p>

    <label class="field-label" for="arxiv">arXiv link or ID</label>
    <input class="text" id="arxiv" name="arxiv" type="text"
      inputmode="url" autocomplete="off" spellcheck="false"
      placeholder="https://arxiv.org/abs/1706.03762 or 1706.03762">
    <span class="hint" id="arxiv-hint">Looked up with the arXiv MCP server;
      see the MCP log tab.</span>

    <fieldset class="depth">
      <legend class="field-label">Notebook depth</legend>
      <div class="segmented">
        <label><input type="radio" name="depth" value="beginner">
          <span>Beginner</span></label>
        <label><input type="radio" name="depth" value="practitioner" checked>
          <span>Practitioner</span></label>
        <label><input type="radio" name="depth" value="expert">
          <span>Expert</span></label>
      </div>
      <span class="hint" id="depth-hint">Balanced: explains the key ideas,
        then implements the method.</span>
    </fieldset>

    <label class="check" id="verify-row">
      <input type="checkbox" id="verify" name="verify">
      <span>Check that the notebook runs
        <span class="hint" id="verify-hint">Runs every cell with
          <code>QUICK_RUN = True</code> on this computer, with your
          permissions, and lets the model fix errors. Only for papers you
          trust; takes a few minutes longer.</span></span>
    </label>

    <button class="primary" id="submit" type="submit" disabled>
      Convert to notebook</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
</div>
