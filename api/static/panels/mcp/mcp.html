<!-- Activity panel, tab "MCP log". Its Live indicator and Clear button are in
     the Activity panel header (panels/activity/activity.html). -->
<div class="tab-panel" id="mcp-panel" role="tabpanel"
  aria-labelledby="tab-mcp" hidden>
  <p class="mcp-server" id="mcp-server">arXiv MCP server · started over
    stdio for each lookup</p>
  <ol class="mcp-events" id="mcp-events" aria-live="polite"></ol>
  <p class="empty" id="mcp-empty">No MCP activity yet. Paste an arXiv link
    under <b>Upload paper / specify link</b> and click
    <b>Convert to notebook</b>: the server start, each tool call with its
    arguments, and each result will show here.</p>
</div>
