<!-- Paper panel, tab "Download". Its Refresh is in the panel header. -->
<div class="tab-panel" id="download-panel" role="tabpanel"
  aria-labelledby="tab-download" hidden>
  <div id="current" hidden>
    <a id="download-link" class="download" href="#">Download notebook</a>
    <p id="saved-path"></p>
    <p id="verify-result" hidden></p>
  </div>
  <p class="label" id="files-label">Generated this session</p>
  <ul class="files" id="files"></ul>
  <p class="empty" id="files-empty">No notebooks yet.</p>
  <footer class="note">Open the <code>.ipynb</code> in Colab with
    File → Upload notebook.</footer>
</div>
