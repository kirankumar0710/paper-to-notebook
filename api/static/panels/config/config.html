    <button class="link" id="config-refresh" type="button">Refresh</button>
  </div>
  <dl class="config">
    <dt>Provider</dt><dd id="cfg-provider">Loading…</dd>

    <dt>Options</dt><dd id="cfg-options">—</dd>
  </dl>

</section>
