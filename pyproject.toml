[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-to-notebook"
version = "0.2.0"
description = "Convert research paper PDFs into Google Colab notebooks using an LLM (Anthropic or Gemini)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "nbformat>=5.9.0",
    "pypdf>=4.0",
    "anthropic>=2.11.0",
    "google-genai>=3.6.0",
    "openai>=3.57.0",
    "httpx>=0.27",
    "mcp>=1.27,<2",
    "arxiv-mcp-server>=0.8.2,<0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=5.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
include = [
    "api*",
    "notebook_builder*",
    "providers*",
    "sources*",
    "util*",
]

[tool.ruff]
line-length = 79
target-version = "py311"
# example/ holds LLM-generated notebooks, kept exactly as generated.
extend-exclude = ["example"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "S",   # flake8-bandit (security)
]

[tool.ruff.lint.per-file-ignores]
# pytest uses bare asserts, and tests hold fake keys/passwords.
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "venv/*"]

[tool.coverage.report]
show_missing = true
fail_under = 95
exclude_also = ['if __name__ == "__main__":']

[tool.setuptools.package-data]
api = ["static/*.html", "static/*.css", "static/*.js", "static/panels/*/*"]
