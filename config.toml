# Vendor defaults, one table per provider (the table name is the value
# PROVIDER is set to).
#
#   base_url     API root, without a trailing slash
#   model        default model id; set to "" to force an explicit choice
#   api_key_env  environment variables holding the key, checked in order
#
# Required environment variables (there are no defaults; the server warns
# at startup and /convert returns 503 until they are set):
#   export PROVIDER=anthropic             # or: gemini, openai
#   export ANTHROPIC_API_KEY=sk-ant-...   # the key named by api_key_env
# Optional:
#   export NOTEBOOK_OUTPUT_DIR=~/papers   # the variable named by
#                                         # [app] output_dir;
#                                         # default ~/Downloads
# API keys are never stored in this file.
#
# To change any of these without editing this file, point
# PAPER_TO_NOTEBOOK_CONFIG at your own .toml file: its values override the
# ones here, key by key. Environment variables (PROVIDER_MODEL,
# PROVIDER_BASE_URL) and keyword overrides passed to get_provider() still
# take precedence over both.

[anthropic]
base_url = "https://api.anthropic.com/v1"
model = "claude-opus-5-5"
api_key_env = ["ANTHROPIC_API_KEY"]
# Tuning (override with PROVIDER_EFFORT, PROVIDER_SPEED, PROVIDER_MAX_TOKENS):
#   effort      low | medium | high | xhigh | max. Higher effort thinks
#               longer: slower, and thinking uses more of max_tokens.
#   speed       standard | fast. Fast mode writes up to ~2.5x faster at
#               twice the per-token price; falls back to standard if busy.
#   max_tokens  output budget shared by thinking and the notebook (max 128000).
effort = "medium"
speed = "fast"
max_tokens = 128000

[gemini]
base_url = "https://generativelanguage.googleapis.com/v1beta"
model = "gemini-3.8-flash"
api_key_env = ["GEMINI_API_KEY"]

[openai]
base_url = "https://api.openai.com/v1"
# Default model; override here or with PROVIDER_MODEL. It must accept PDF
# input.
model = "gpt-5.5"
api_key_env = ["OPENAI_API_KEY"]
# Tuning (override with PROVIDER_EFFORT, PROVIDER_MAX_TOKENS); not sent
# unless set, so models without reasoning work too:
#   effort      none | minimal | low | medium | high | xhigh | max
#   max_tokens  output budget shared by reasoning and the notebook.
# effort = "medium"
# max_tokens = 64000

# Application settings.
#
#   output_dir   environment variable holding the folder where every
#                generated notebook is also saved. If the variable is not
#                set, the folder is ~/Downloads. e.g.
#                  export NOTEBOOK_OUTPUT_DIR=~/papers
#                Relative paths are resolved from the project root;
#                ~ and $VARIABLES in the value are expanded.
[app]
output_dir = "NOTEBOOK_OUTPUT_DIR"

# arXiv papers. Pasting an arXiv ID or link looks the paper up with the
# arXiv MCP server (the arxiv-mcp-server package), started over stdio for
# each lookup; the app then downloads the PDF from arxiv.org.
#
#   command  how to start the MCP server; "{python}" is this app's Python.
#            e.g. ["uvx", "arxiv-mcp-server"] to run it with uv instead.
#   timeout  seconds to wait for the MCP lookup.
[arxiv]
command = ["{python}", "-m", "arxiv_mcp_server"]
timeout = 60

# Prices for the dashboard's cost estimate.
#
#   fast_multiplier  fast mode is billed at this times the prices below.
#
# [pricing.models] lists USD per million tokens at standard speed. A model
# that is not listed shows no cost. Prices change: check the provider's
# pricing page. Quote model ids that contain a dot, e.g. "gemini-3.8-flash".
# The estimate uses the model that actually answered (a fallback model can
# differ from the one requested) and ignores any declined attempt before it.
[pricing]
fast_multiplier = 2

[pricing.models]
claude-opus-5-5 = { input = 4.00, output = 20.00 }
claude-opus-5 = { input = 5.00, output = 25.00 }
claude-opus-4-8 = { input = 5.00, output = 25.00 }
claude-sonnet-5-5 = { input = 2.00, output = 10.00 }
# Fill in from Google's / OpenAI's pricing pages to see those costs:
# "gemini-3.8-flash" = { input = 0.00, output = 0.00 }
# "gpt-5.5" = { input = 0.00, output = 0.00 }
